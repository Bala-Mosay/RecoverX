version: "3.8"

services:
  recoverx:
    build: .
    container_name: recoverx-engine
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - PYTHONUNBUFFERED=1
      - RAZORPAY_TEST_KEY=${RAZORPAY_TEST_KEY}
      - RAZORPAY_TEST_SECRET=${RAZORPAY_TEST_SECRET}
    command: python run_recovery.py

  api:
    build: .
    container_name: recoverx-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - RAZORPAY_TEST_KEY=${RAZORPAY_TEST_KEY}
      - RAZORPAY_TEST_SECRET=${RAZORPAY_TEST_SECRET}
    command: python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - recoverx

  dashboard:
    build: .
    container_name: recoverx-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m streamlit run src/dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - recoverx

  tests:
    build: .
    container_name: recoverx-tests
    volumes:
      - ./data:/app/data
    command: python -m pytest tests/ -v

volumes:
  data:
  models:
